[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-adventure"
version = "0.1.0"
description = "A PyPy-optimized pipeline system for data processing and AI integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Silver Adventure Team", email = "team@silver-adventure.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "httpx>=0.23.0",
    "requests>=2.28.0",
    "sqlalchemy>=1.4.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.2.0",
    "pydantic>=1.10.0",
    "python-dotenv>=0.20.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.14.0",
    "asyncpg>=0.26.0",
    "aioredis>=2.0.0",
    "celery>=5.2.0",
    "redis>=4.3.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.9.0",
    "torch>=1.12.0",
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0",
    "mlflow>=1.28.0",
    "wandb>=0.13.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.10.0",
    "streamlit>=1.12.0",
    "dash>=2.6.0",
    "gradio>=3.4.0",
]
dev = [
    "pytest>=7.1.0",
    "black>=22.6.0",
    "flake8>=5.0.0",
    "mypy>=0.971",
    "pre-commit>=2.20.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.19.0",
]
performance = [
    "numba>=0.56.0",
    "cython>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/Thhe1oldlady/silver-adventure"
Repository = "https://github.com/Thhe1oldlady/silver-adventure"
Documentation = "https://github.com/Thhe1oldlady/silver-adventure#readme"
Issues = "https://github.com/Thhe1oldlady/silver-adventure/issues"

[project.scripts]
silver-pipeline = "silver_adventure.cli:main"
silver-server = "silver_adventure.api.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["silver_adventure*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=silver_adventure",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg"]

[tool.coverage.run]
source = ["silver_adventure"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]