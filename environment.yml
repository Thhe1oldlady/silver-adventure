name: silver-adventure
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.9
  - pip
  
  # Data Processing
  - pandas>=1.5.0
  - numpy>=1.21.0
  - scipy>=1.9.0
  - scikit-learn>=1.1.0
  
  # Web Framework
  - fastapi>=0.85.0
  - uvicorn>=0.18.0
  - httpx>=0.23.0
  - requests>=2.28.0
  
  # Database
  - sqlalchemy>=1.4.0
  - psycopg2>=2.9.0
  - pymongo>=4.2.0
  
  # ML & AI
  - tensorflow>=2.9.0
  - pytorch>=1.12.0
  - xgboost>=1.6.0
  - lightgbm>=3.3.0
  
  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - plotly>=5.10.0
  
  # Development
  - pytest>=7.1.0
  - black>=22.6.0
  - flake8>=5.0.0
  - mypy>=0.971
  - pre-commit>=2.20.0
  
  # Performance
  - numba>=0.56.0
  - cython>=0.29.0
  
  # Configuration
  - pydantic>=1.10.0
  - python-dotenv>=0.20.0
  - pyyaml>=6.0
  
  # Monitoring
  - prometheus-client>=0.14.0
  
  # Pip dependencies
  - pip:
    - pypy3.9  # PyPy compatibility
    - asyncpg>=0.26.0
    - aioredis>=2.0.0
    - celery>=5.2.0
    - redis>=4.3.0
    - mlflow>=1.28.0
    - wandb>=0.13.0
    - streamlit>=1.12.0
    - dash>=2.6.0
    - gradio>=3.4.0