name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
    
    - name: Create directories
      run: |
        mkdir -p logs
        mkdir -p models
        mkdir -p data
    
    - name: Run linting
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503
    
    - name: Check code formatting
      run: |
        black --check src/ tests/
    
    - name: Check import sorting
      run: |
        isort --check-only src/ tests/
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src/silver_adventure --cov-report=xml --cov-report=html
      env:
        PYTHONPATH: ${{ github.workspace }}/src
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security analysis
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        inputs: requirements.txt
    
    - name: Run Bandit security scanner
      run: |
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: dist/
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        # Add your smoke test commands here
        
    - name: Deploy to production
      if: success()
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here

  email-test:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test email generation
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from silver_adventure.services.email_service import EmailService
        
        service = EmailService()
        templates = service.get_available_templates()
        print(f'Available templates: {templates}')
        
        # Test template generation
        for template in templates:
            content = service._generate_golden_mood_content(template, {'name': 'Test User'})
            print(f'Template {template}: Subject = {content[\"subject\"]}')
            assert content['html'] and content['text'], f'Template {template} failed'
        
        print('All email templates tested successfully!')
        "
      env:
        PYTHONPATH: ${{ github.workspace }}/src

  model-training:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create directories
      run: |
        mkdir -p models
        mkdir -p data
    
    - name: Test model training
      run: |
        python -c "
        import sys
        import asyncio
        sys.path.append('src')
        from silver_adventure.services.churn_service import ChurnService
        
        async def test_training():
            service = ChurnService()
            result = await service.train_model()
            print(f'Training result: {result}')
            assert result['status'] == 'trained'
            assert result['accuracy'] > 0.5
            print('Model training test passed!')
        
        asyncio.run(test_training())
        "
      env:
        PYTHONPATH: ${{ github.workspace }}/src

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create directories
      run: |
        mkdir -p logs
        mkdir -p models
        mkdir -p data
    
    - name: Start FastAPI server
      run: |
        uvicorn src.silver_adventure.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        PYTHONPATH: ${{ github.workspace }}/src
    
    - name: Run integration tests
      run: |
        # Test health endpoint
        curl -f http://localhost:8000/health
        
        # Test API documentation
        curl -f http://localhost:8000/docs
        
        # Test email templates endpoint
        curl -f http://localhost:8000/api/v1/email/templates
        
        # Test churn features endpoint
        curl -f http://localhost:8000/api/v1/predict/churn/features
        
        echo "Integration tests passed!"